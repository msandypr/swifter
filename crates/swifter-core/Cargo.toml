[package]
name = "swifter-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core engine and PE analyzer for packaging Windows executables into macOS bundles"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pelite = "0.10"
image = "0.25"
icns = "0.3"
walkdir = "2.4"
regex = "1.10"
dirs = "5.0"
slugify = "0.1.0"
sha2 = "0.10"
base64 = "0.22"
