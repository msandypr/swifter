[package]
name = "swifter-desktop"
version = "0.3.0"
description = "Portable Windows (.exe) to Native macOS (.app) Packaging Engine"
authors = ["msandypr"]
edition = "2024"
license = "GPL-3.0-only"

[lib]
name = "swifter_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
swifter-core = { path = "../../crates/swifter-core" }
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
walkdir = "2.4"
base64 = "0.22"
icns = "0.3"


